        <p>Anno Domini 1695: This present yeare was accompanied with excessive frost and snow in the moneth of May, whereby the seed cornes rotted in the furrows.
        <p>The boll of meal did rise from four punds Scots to sixteen punds Scots in Martinmas 1696. The poor and destitute people did perish in great multitudes by the dykes and high-wayes through hunger.

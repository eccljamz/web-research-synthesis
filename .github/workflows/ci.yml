name: CI Test Matrix

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package in editable mode
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps

      - name: Run Unit & Adversarial Test Suite (255 Tests)
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -v

      - name: Run Acceptance Verification Runner (Strict Mock Mode)
        env:
          PYTHONPATH: src
        run: |
          python verify.py --mode=mock --queries=all --strict

      - name: Test CLI End-to-End Execution
        run: |
          python run_research.py "Autonomous Research Synthesis" --mode=mock --format=all

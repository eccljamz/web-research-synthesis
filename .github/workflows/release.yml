name: Release & Distribution Packaging

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish GitHub Release draft"
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build Wheel & Source Distribution
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build wheel

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Verify Distribution Artifacts
        run: |
          ls -la dist/
          python -m pip install dist/*.whl

      - name: Test Installed Package
        run: |
          python -m unittest discover -s tests -v
          python -m research_synthesis.cli --help
          research-synthesis --help
          research-server --help

      - name: Run Strict Invariant Verification on Built Wheel
        run: |
          python verify.py --mode=mock --queries=all --strict

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
